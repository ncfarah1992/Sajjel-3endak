led if you can.</li><li>The highest card of the suit led wins the trick, and the winner leads the next trick.</li><li>Try not to win tricks that hold hearts, the 10♦ or the Q♠.</li></ul>"],["Scoring a round",'<p>After the 13 tricks, each player counts the penalty cards they took. The four scores always add up to 36.</p><div class="ex"><b>Example</b> Maya took 4 hearts and the Q♠: 4 + 13 = <b>17</b>. Rami took the 10♦ and 2 hearts: <b>12</b>. Karim took 7 hearts: <b>7</b>. Nico took nothing: <b>0</b>.</div>'],["Taking all 36 (every player for themselves)","<p>If one player takes <b>every heart, the 10♦ and the Q♠</b>, they score <b>0</b> and each of the other three scores <b>36</b>.</p><p>In teams this rule does not apply: the 36 points count normally.</p>"],["End of the game","<ul><li><b>Every player for themselves:</b> the game ends when someone reaches 101 or more. The player with the <b>lowest score</b> wins.</li><li><b>Teams of 2:</b> each player keeps their own score. The <b>first player to reach 101 loses the game for their team</b>.</li></ul>"]],400:[["At a glance","<ul><li>4 players in <b>teams of 2</b>, partners sit opposite.</li><li>13 cards each. <b>Hearts are always trump.</b></li><li>Every player has their <b>own score</b>.</li><li>A team wins when one player reaches <b>41 or more</b> and their partner is <b>above 0</b>.</li></ul>"],["Bidding",'<p>Before the hand, each player bids how many tricks <b>they</b> will take on their own. The smallest bid is <b>2</b>.</p><p>The four bids together must reach a minimum, or the cards are dealt again:</p><table class="rt"><tr><td>Normal</td><td><b>11</b></td></tr><tr><td>Someone has 30 to 39</td><td><b>12</b></td></tr><tr><td>Someone has 40 or more</td><td><b>13</b></td></tr></table>'],["Playing a hand","<ul><li>Follow the suit that was led if you can.</li><li>If you can't, you can play a heart to trump.</li><li>The highest heart wins the trick. With no heart, the highest card of the suit led wins.</li></ul>"],["Scoring a round",'<p>If you take <b>at least</b> your bid, you <b>add</b> the bid\'s value. If you take fewer, you <b>lose</b> it. Extra tricks count for nothing.</p><p>The value depends on <b>your own score before the round</b>:</p>\n      <div class="tablewrap"><table class="rt"><thead><tr><th>Bid</th><th>Below 30</th><th>30 and above</th></tr></thead><tbody>\n      <tr><td>2, 3, 4</td><td>2, 3, 4</td><td>2, 3, 4</td></tr><tr><td>5</td><td>10</td><td>5</td></tr><tr><td>6</td><td>12</td><td>6</td></tr><tr><td>7</td><td>14</td><td>7</td></tr><tr><td>8</td><td>24</td><td>16</td></tr><tr><td>9</td><td>27</td><td>27</td></tr><tr><td>10</td><td>40</td><td>40</td></tr><tr><td>11</td><td>44</td><td>44</td></tr><tr><td>12</td><td>48</td><td>48</td></tr><tr><td>13</td><td colspan="2">Win the game, or −52</td></tr></tbody></table></div>\n      <div class="ex"><b>Example</b> Rami has 12 points, bids 6 and takes 7: <b>+12</b>. Next round he has 34, bids 6 and takes 5: <b>−6</b>. Maya bids 4 and takes 6: <b>+4</b>.</div>'],["Winning","<ul><li>A team wins when one player reaches <b>41 or more</b> and their partner's score is <b>above 0</b>. If the partner is at 0 or below, play continues.</li><li>A player who bids <b>13 and takes all 13 tricks</b> wins the game for their team at once. Missing it costs <b>52</b>.</li></ul>"]],tarneeb:[["At a glance","<ul><li>4 players in <b>teams of 2</b>, partners sit opposite.</li><li>13 cards each.</li><li>The team shares <b>one score</b>. The first team to <b>31</b> wins.</li></ul>"],["Bidding","<p>Players bid how many tricks their <b>team</b> will take, from <b>7 to 13</b>. The highest bid wins, and that player chooses the <b>trump suit</b> (the tarneeb).</p>"],["Playing a hand","<ul><li>Follow the suit that was led if you can.</li><li>If you can't, you can play a trump.</li><li>The highest trump wins the trick. With no trump, the highest card of the suit led wins.</li></ul>"],["Scoring a round",'<ul><li><b>Bidding team makes its bid:</b> it scores the tricks it took. The other team scores nothing.</li><li><b>Bidding team fails:</b> it loses the amount it bid, and the other team scores the tricks it took.</li><li>There is no bonus for bidding 13.</li></ul>\n      <div class="ex"><b>Example</b> Team A bids 9 and takes 10: Team A <b>+10</b>, Team B 0.<br>Team B bids 8 and takes 7: Team B <b>−8</b>, Team A <b>+6</b>.</div>'],["Winning","<p>The first team to reach <b>31 or more</b> wins the game.</p>"]],trex:[["At a glance","<ul><li>4 players, a full 52-card deck, 13 cards each.</li><li><b>Every player for themselves.</b></li><li>The game has <b>4 kingdoms</b>. Each player is the <b>king</b> once.</li><li>The player with the <b>highest total</b> after the 4 kingdoms wins.</li></ul>"],["Kingdoms and contracts","<p>In their kingdom, the king chooses the order of the contracts and every contract is played once.</p><ul><li><b>Classic:</b> 5 contracts per kingdom: King of Hearts, Queens, Diamonds, Tricks and Trex. That is 20 hands in a game.</li><li><b>Complex:</b> 2 contracts per kingdom: Complex (all four penalties counted in one hand) and Trex. That is 8 hands in a game.</li></ul><p>The kingdom then passes to the next player around the table.</p>"],["The penalty contracts",'<table class="rt"><tr><td>King of Hearts</td><td>whoever takes the K♥</td><td><b>−75</b></td></tr><tr><td>Queens</td><td>each queen taken</td><td><b>−25</b></td></tr><tr><td>Diamonds</td><td>each diamond taken</td><td><b>−10</b></td></tr><tr><td>Tricks</td><td>each trick taken</td><td><b>−15</b></td></tr></table><p>Follow the suit that was led if you can. The highest card of the suit led wins the trick. There is no trump.</p><p>In <b>Complex</b>, all four penalties count in the same hand: −500 shared between the players.</p>'],["Doubling",'<p>A player holding the <b>K♥</b> or a <b>queen</b> can double it before play.</p><ul><li>If someone else takes the doubled card, they lose <b>double</b> (−150 for the K♥, −50 for a queen), and the player who doubled <b>gains</b> the normal value (+75 or +25).</li><li>If the player who doubled ends up taking it, they lose double themselves.</li></ul><div class="ex"><b>Example</b> Maya doubles the K♥ and Rami is forced to take it: Rami <b>−150</b>, Maya <b>+75</b>.</div>'],["Trex","<p>Players build the four suits on the table starting from the Jacks, going up and down. The first player to run out of cards scores <b>+200</b>, then <b>+150</b>, <b>+100</b> and <b>+50</b>.</p>"],["Totals","<p>Without doubling, the four penalty contracts give out −500 and Trex gives back +500, so every kingdom adds up to zero. The winner is whoever has the most points after the 4th kingdom.</p>"]],app:[["Start a game","<p>Go to <b>Tables</b> and tap <b>New game</b>. Choose the card game, then tap 4 players. In teams, the first two players you tap are <b>Team A</b> (blue) and the next two are <b>Team B</b> (orange).</p>"],["Score a round","<ul><li><b>Leekha:</b> after the hand, give each player their hearts and tap who took the Q♠ and the 10♦. <b>Take the rest</b> gives a player everything not yet given out.</li><li><b>400:</b> enter everyone's bids before the hand, then the tricks after it.</li><li><b>Tarneeb:</b> enter who won the bidding, the bid and the trump, then the tricks the bidding team took.</li><li><b>Trex:</b> the king picks the contract, then you record who took what, who doubled, or the finishing order.</li></ul><p>Made a mistake? Tap <b>✎</b> next to any round to fix it.</p>"],["Several games at once","<p>Leave a game at any time with <b>← All tables</b>. It waits there until you continue it. If a player leaves, use <b>Substitute a player</b>: the new player continues from that seat's score.</p>"],["Playing as a group","<ul><li>Join your group with its 6-letter code under <b>Players → Online sync</b>.</li><li>Pick yourself under <b>This phone belongs to</b>. Only your phone can edit your profile.</li><li>The phone that starts a game keeps its score. Everyone else watches it live as <b>view only</b>.</li><li>Keep your <b>personal key</b>. On a new phone, tap your locked name and enter it to get your profile and games back.</li></ul>"]]},ar:{title:"كتاب القواعد",back:"→ رجوع",tabs:{leekha:"ليخة",400:"400",tarneeb:"طرنيب",trex:"تركس",app:"استعمال التطبيق"},leekha:[["نظرة سريعة","<ul><li>4 لاعبين، شدّة كاملة من 52 ورقة، 13 ورقة لكلّ لاعب.</li><li>اللعب <b>كلّ لاعب لحاله</b> أو <b>فرق من لاعبَين</b> (الشريكان متقابلان).</li><li>أوراق العقوبة: كلّ <b>♥ بنقطة</b>، <b>الـ10♦ بـ10</b>، <b>الـQ♠ بـ13</b>. أي <b>36 نقطة</b> في كلّ جولة.</li><li>الهدف هو <b>البقاء تحت 101</b>.</li></ul>"],["التوزيع","<p>الموزّع الأوّل يُختار عشوائياً. بعد ذلك <b>من يأخذ الـQ♠ يوزّع الجولة التالية</b>. وإذا أخذ لاعب كلّ أوراق الكبّة الـ13، يوزّع هو.</p>"],["اللعب","<ul><li>لا يوجد طرنيب.</li><li>يجب أن تلعب من نفس النوع المطروح إذا كان معك.</li><li>أعلى ورقة من النوع المطروح تأكل، ومن يأكل يبدأ الأكلة التالية.</li><li>حاول ألّا تأكل أكلات فيها كبّة أو الـ10♦ أو الـQ♠.</li></ul>"],["حساب الجولة",'<p>بعد الأكلات الـ13، يحسب كلّ لاعب أوراق العقوبة التي أخذها. مجموع النقاط دائماً 36.</p><div class="ex"><b>مثال</b> مايا أخذت 4 كبّات والـQ♠: ‏4 + 13 = <b>17</b>. رامي أخذ الـ10♦ وكبّتين: <b>12</b>. كريم أخذ 7 كبّات: <b>7</b>. نيكو لم يأخذ شيئاً: <b>0</b>.</div>'],["أخذ الـ36 كلّها (كلّ لاعب لحاله)","<p>إذا أخذ لاعب <b>كلّ الكبّات والـ10♦ والـQ♠</b>، يسجّل <b>0</b> ويسجّل كلّ واحد من الثلاثة الآخرين <b>36</b>.</p><p>في الفرق لا تُطبَّق هذه القاعدة، وتُحسب الـ36 عادياً.</p>"],["نهاية اللعبة","<ul><li><b>كلّ لاعب لحاله:</b> تنتهي اللعبة عندما يصل أحدهم إلى 101 أو أكثر، ويربح صاحب <b>أقلّ نتيجة</b>.</li><li><b>فرق من لاعبَين:</b> لكلّ لاعب نتيجته. <b>أوّل لاعب يصل إلى 101 يخسر اللعبة لفريقه</b>.</li></ul>"]],400:[["نظرة سريعة","<ul><li>4 لاعبين في <b>فرق من لاعبَين</b>، الشريكان متقابلان.</li><li>13 ورقة لكلّ لاعب. <b>الكبّة دائماً طرنيب.</b></li><li>لكلّ لاعب <b>نتيجته الخاصة</b>.</li><li>يربح الفريق عندما يصل أحد لاعبيه إلى <b>41 أو أكثر</b> وشريكه <b>فوق الصفر</b>.</li></ul>"],["الطلب",'<p>قبل اللعب، يطلب كلّ لاعب عدد الأكلات التي سيأكلها <b>هو</b> وحده. أقلّ طلب هو <b>2</b>.</p><p>يجب أن يصل مجموع الطلبات الأربعة إلى حدّ أدنى، وإلّا تُوزَّع الأوراق من جديد:</p><table class="rt"><tr><td>عادةً</td><td><b>11</b></td></tr><tr><td>أحدهم بين 30 و39</td><td><b>12</b></td></tr><tr><td>أحدهم 40 أو أكثر</td><td><b>13</b></td></tr></table>'],["اللعب","<ul><li>العب من نفس النوع المطروح إذا كان معك.</li><li>إذا لم يكن معك، يمكنك أن تقطع بكبّة.</li><li>أعلى كبّة تأكل. وإذا لم تُلعب كبّة، تأكل أعلى ورقة من النوع المطروح.</li></ul>"],["حساب الجولة",'<p>إذا أكلت <b>على الأقل</b> ما طلبته، <b>تُضاف</b> قيمة طلبك. وإذا أكلت أقلّ، <b>تُطرح</b>. الأكلات الزائدة لا تُحسب.</p><p>القيمة تعتمد على <b>نتيجتك قبل الجولة</b>:</p>\n      <div class="tablewrap"><table class="rt"><thead><tr><th>الطلب</th><th>تحت 30</th><th>30 وما فوق</th></tr></thead><tbody>\n      <tr><td>2، 3، 4</td><td>2، 3، 4</td><td>2، 3، 4</td></tr><tr><td>5</td><td>10</td><td>5</td></tr><tr><td>6</td><td>12</td><td>6</td></tr><tr><td>7</td><td>14</td><td>7</td></tr><tr><td>8</td><td>24</td><td>16</td></tr><tr><td>9</td><td>27</td><td>27</td></tr><tr><td>10</td><td>40</td><td>40</td></tr><tr><td>11</td><td>44</td><td>44</td></tr><tr><td>12</td><td>48</td><td>48</td></tr><tr><td>13</td><td colspan="2">ربح اللعبة، أو −52</td></tr></tbody></table></div>\n      <div class="ex"><b>مثال</b> رامي معه 12 نقطة، طلب 6 وأكل 7: <b>+12</b>. في الجولة التالية معه 34، طلب 6 وأكل 5: <b>−6</b>. مايا طلبت 4 وأكلت 6: <b>+4</b>.</div>'],["الربح","<ul><li>يربح الفريق عندما يصل أحد لاعبيه إلى <b>41 أو أكثر</b> ونتيجة شريكه <b>فوق الصفر</b>. إذا كان الشريك على الصفر أو تحته، يستمرّ اللعب.</li><li>من يطلب <b>13 ويأكل كلّ الأكلات</b> يربح اللعبة لفريقه فوراً. وإذا فشل تُطرح منه <b>52</b>.</li></ul>"]],tarneeb:[["نظرة سريعة","<ul><li>4 لاعبين في <b>فرق من لاعبَين</b>، الشريكان متقابلان.</li><li>13 ورقة لكلّ لاعب.</li><li>للفريق <b>نتيجة واحدة</b>. أوّل فريق يصل إلى <b>31</b> يربح.</li></ul>"],["الطلب","<p>يطلب اللاعبون عدد الأكلات التي سيأكلها <b>فريقهم</b>، من <b>7 إلى 13</b>. أعلى طلب يربح، وصاحبه يختار <b>الطرنيب</b>.</p>"],["اللعب","<ul><li>العب من نفس النوع المطروح إذا كان معك.</li><li>إذا لم يكن معك، يمكنك أن تقطع بالطرنيب.</li><li>أعلى طرنيب يأكل. وإذا لم يُلعب طرنيب، تأكل أعلى ورقة من النوع المطروح.</li></ul>"],["حساب الجولة",'<ul><li><b>الفريق الطالب يحقّق طلبه:</b> يسجّل عدد الأكلات التي أكلها، والفريق الآخر لا يسجّل شيئاً.</li><li><b>الفريق الطالب يفشل:</b> يُطرح منه طلبه، والفريق الآخر يسجّل أكلاته.</li><li>لا توجد مكافأة لطلب 13.</li></ul>\n      <div class="ex"><b>مثال</b> الفريق أ طلب 9 وأكل 10: الفريق أ <b>+10</b>، الفريق ب 0.<br>الفريق ب طلب 8 وأكل 7: الفريق ب <b>−8</b>، الفريق أ <b>+6</b>.</div>'],["الربح","<p>أوّل فريق يصل إلى <b>31 أو أكثر</b> يربح اللعبة.</p>"]],trex:[["نظرة سريعة","<ul><li>4 لاعبين، شدّة كاملة من 52 ورقة، 13 ورقة لكلّ لاعب.</li><li><b>كلّ لاعب لحاله.</b></li><li>اللعبة فيها <b>4 ممالك</b>، وكلّ لاعب يكون <b>الملك</b> مرّة واحدة.</li><li>يربح صاحب <b>أعلى مجموع</b> بعد الممالك الأربع.</li></ul>"],["الممالك والعقود","<p>في مملكته، يختار الملك ترتيب العقود، ويُلعب كلّ عقد مرّة واحدة.</p><ul><li><b>كلاسيك:</b> 5 عقود في كلّ مملكة: الشايب، البنات، الديناري، اللطوش، والتركس. أي 20 يداً في اللعبة.</li><li><b>كومبلكس:</b> عقدان في كلّ مملكة: الكومبلكس (كلّ العقوبات الأربع في يد واحدة) والتركس. أي 8 أيدٍ في اللعبة.</li></ul><p>ثمّ تنتقل المملكة إلى اللاعب التالي حول الطاولة.</p>"],["عقود العقوبات",'<table class="rt"><tr><td>الشايب</td><td>من يأخذ الـK♥</td><td><b>−75</b></td></tr><tr><td>البنات</td><td>كلّ بنت</td><td><b>−25</b></td></tr><tr><td>الديناري</td><td>كلّ ورقة ديناري</td><td><b>−10</b></td></tr><tr><td>اللطوش</td><td>كلّ أكلة</td><td><b>−15</b></td></tr></table><p>العب من نفس النوع المطروح إذا كان معك. أعلى ورقة من النوع المطروح تأكل. لا يوجد طرنيب.</p><p>في <b>الكومبلكس</b> تُحسب العقوبات الأربع في نفس اليد: −500 بين اللاعبين.</p>'],["الدبل",'<p>من معه <b>الشايب</b> أو <b>بنت</b> يستطيع أن يدبّلها قبل اللعب.</p><ul><li>إذا أخذها لاعب آخر، يخسر <b>الضعف</b> (−150 للشايب، −50 للبنت)، ومن دبّل <b>يربح</b> القيمة العادية (+75 أو +25).</li><li>إذا أخذها من دبّلها بنفسه، يخسر الضعف.</li></ul><div class="ex"><b>مثال</b> مايا دبّلت الشايب ورامي اضطرّ أن يأخذه: رامي <b>−150</b>، مايا <b>+75</b>.</div>'],["التركس","<p>يبني اللاعبون الأنواع الأربعة على الطاولة بدءاً من الشبّ (J) صعوداً ونزولاً. أوّل من تخلص أوراقه يسجّل <b>+200</b>، ثمّ <b>+150</b> و<b>+100</b> و<b>+50</b>.</p>"],["المجموع","<p>بدون دبل، العقوبات الأربع تعطي −500 والتركس يعيد +500، فكلّ مملكة مجموعها صفر. يربح صاحب أكثر النقاط بعد المملكة الرابعة.</p>"]],app:[["بدء لعبة","<p>اذهب إلى <b>الطاولات</b> واضغط <b>لعبة جديدة</b>. اختر لعبة الورق ثمّ 4 لاعبين. في الفرق، أوّل لاعبَين تختارهما هما <b>الفريق أ</b> (أزرق) والاثنان التاليان <b>الفريق ب</b> (برتقالي).</p>"],["تسجيل جولة","<ul><li><b>ليخة:</b> بعد اللعب، أعطِ كلّ لاعب كبّاته واضغط على من أخذ الـQ♠ والـ10♦. زرّ <b>ياخد الباقي</b> يعطي اللاعب كلّ ما لم يُوزَّع بعد.</li><li><b>400:</b> سجّل طلبات الجميع قبل اللعب، ثمّ الأكلات بعده.</li><li><b>طرنيب:</b> سجّل من ربح الطلب والطلب والطرنيب، ثمّ أكلات الفريق الطالب.</li><li><b>تركس:</b> الملك يختار العقد، ثمّ تسجّل من أخذ ماذا ومن دبّل، أو ترتيب الخروج.</li></ul><p>أخطأت؟ اضغط <b>✎</b> بجانب أيّ جولة لتصحيحها.</p>"],["عدّة ألعاب في وقت واحد","<p>اترك اللعبة متى شئت بزرّ <b>كلّ الطاولات</b>. تنتظرك هناك حتى تكملها. إذا غادر لاعب، استعمل <b>استبدال لاعب</b>: اللاعب الجديد يكمل من نتيجة ذلك المقعد.</p>"],["اللعب كمجموعة","<ul><li>انضمّ إلى مجموعتك برمزها المؤلّف من 6 أحرف في <b>اللاعبون ← المزامنة</b>.</li><li>اختر نفسك في <b>هذا الهاتف لـ</b>. هاتفك وحده يعدّل ملفّك.</li><li>الهاتف الذي يبدأ اللعبة يسجّل نتائجها، والباقون يشاهدونها مباشرةً <b>للمشاهدة فقط</b>.</li><li>احتفظ <b>بمفتاحك الشخصي</b>. على هاتف جديد، اضغط على اسمك المقفل وأدخله لاستعادة ملفّك وألعابك.</li></ul>"]]}},Gt=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;let Ut=null;function Jt(){return E.games.filter((e=>re(e))).sort(((e,t)=>(e.date||"").lo
