<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3127">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sajjel 3endak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sajjel 3endak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Reem+Kufi:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app on green felt; scoreboard is a card table with players seated N/E/S/W; gold for actions, ivory for cards */
:root{
  color-scheme:dark; padding-top:env(safe-area-inset-top,0px);
  --felt-hi:#2d7a5f; --felt:#1c5241; --felt-lo:#0f3127; --bg:#164535;
  --surface:rgba(4,22,17,.34); --card:rgba(255,255,255,.07); --line:rgba(231,196,106,.24);
  --ink:#F6F1E3; --muted:#B3C3B9; --gold:#E7C46A; --gold-ink:#173a2e; --ivory:#FBF8EF;
  --red:#C0262D; --black:#1a1a1a; --warn:#F4B860; --bad:#FF8A7A; --good:#8EE0A8;
  --felt-ink:#173a2e;
  --f-logo-ar:"Reem Kufi", "Geeza Pro", "Noto Kufi Arabic", sans-serif;
  --f-display:"Fraunces", Georgia, serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html{background:var(--felt-lo)}
body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100%;
  background:var(--bg) radial-gradient(130% 70% at 50% 30%,var(--felt-hi) 0%,var(--felt) 50%,var(--felt-lo) 100%) fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--felt-lo)}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:92px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(15,49,39,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;margin:0;font-weight:400}
.logo .ar{font-family:var(--f-logo-ar);font-weight:700;font-size:26px;line-height:1;color:var(--gold);white-space:nowrap}
.logo{min-width:0;flex:none}
.logo .lat b{white-space:nowrap}
.brand small{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.logo .lat{display:flex;flex-direction:column;line-height:1.05;border-inline-start:1px solid var(--line);padding-inline-start:10px}
.logo .lat b{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.01em}
.logo .lat b i{font-style:normal;color:var(--gold)}
.logo .lat span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand small{font:600 11px var(--f-mono);letter-spacing:.02em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(231,196,106,.6);border-radius:99px;padding:3px 10px;white-space:nowrap}

main{flex:1;display:flex;flex-direction:column;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h2{font-family:var(--f-display);font-weight:800;font-size:21px;margin:0;text-wrap:balance;letter-spacing:.005em}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;opacity:.9}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;color:var(--ink)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn.big{width:100%;padding:14px;font-size:16px;font-family:var(--f-display);font-weight:800;letter-spacing:.01em}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4}
.btn.sm{padding:6px 10px;font-size:13px}
input[type=text],select{font:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:rgba(246,241,227,.4)}
.notice{font-size:12.5px;color:var(--muted);background:rgba(0,0,0,.18);border:1px dashed var(--line);border-radius:12px;padding:9px 11px}
.notice b{color:var(--ink)}
.ok{color:var(--good)} .err{color:var(--bad)}

/* the card table */
.tablebox{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:1/1.06}
.tablebox .oval{position:absolute;inset:19% 17%;border-radius:50%;border:2px solid rgba(231,196,106,.38);background:radial-gradient(closest-side,rgba(255,255,255,.06),rgba(0,0,0,.18));box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 0 0 6px rgba(0,0,0,.08)}
.tablebox .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.tablebox .pile{display:flex}
.tablebox .pile .pc{box-shadow:0 3px 8px rgba(0,0,0,.4)}
.tablebox .pile .pc:nth-child(1){transform:rotate(-14deg) translate(9px,3px)}
.tablebox .pile .pc:nth-child(2){transform:rotate(3deg);z-index:1}
.tablebox .pile .pc:nth-child(3){transform:rotate(17deg) translate(-9px,4px)}
.tablebox .rlabel{font:600 10px var(--f-mono);letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.seat{position:absolute;width:31%;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.seat.n{top:0;left:50%;transform:translateX(-50%)} .seat.s{bottom:0;left:50%;transform:translateX(-50%)}
.seat.w{left:0;top:50%;transform:translateY(-50%)} .seat.e{right:0;top:50%;transform:translateY(-50%)}
.seat .name{font-size:13px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .score{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.seat .score small{font:500 10px var(--f-mono);color:var(--muted);margin-left:2px}
.seat.warn .score{color:var(--warn)} .seat.bad .score{color:var(--bad)}
.seat .meter{width:64px}
.seat .tag{min-height:16px;display:flex;align-items:center}
.seat .team{font:600 9px var(--f-mono);letter-spacing:.1em;color:var(--muted)}
.seat.won .avatar{box-shadow:0 0 0 3px var(--good)} .seat.lost .avatar{box-shadow:0 0 0 3px var(--bad)}
.meter{height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
.warn .meter i{background:var(--warn)} .bad .meter i{background:var(--bad)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.lose{color:var(--bad)} .pill.win{color:var(--good)} .pill.hot{color:var(--warn)}
.result{border-color:var(--gold);background:linear-gradient(160deg,rgba(231,196,106,.18),rgba(0,0,0,.25))}
.result .crown{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--gold)}

/* playing cards */
.pc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:30px;height:42px;border-radius:5px;background:var(--ivory);
  border:1px solid rgba(0,0,0,.12);font-family:var(--f-mono);font-weight:600;font-size:12px;line-height:1;gap:2px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pc.r{color:var(--red)} .pc.k{color:var(--black)}
.pc.big{width:40px;height:56px;font-size:15px}
.pc.off{opacity:.25}
.hand{display:flex;flex-wrap:wrap;gap:4px}

/* avatars */
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#CDE6F5;color:var(--gold-ink);border:2px solid var(--gold);font-family:var(--f-display);font-weight:800;font-size:14px;flex:none}
.avatar.lg{width:46px;height:46px;font-size:16px}
.avatar.xl{width:58px;height:58px;font-size:21px}

/* round entry */
.alloc{display:flex;flex-direction:column;gap:10px}
.prow{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.prow .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prow .who{display:flex;align-items:center;gap:10px;min-width:0}
.prow .pts{font-family:var(--f-display);font-weight:800;font-size:20px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.22);font-size:20px;font-weight:600;color:var(--ink)}
.step button:disabled{opacity:.3}
.step span{min-width:26px;text-align:center;font-size:17px}
.specials{display:flex;gap:8px}
.tog{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:10px;padding:4px 9px 4px 4px;font-size:13px;font-weight:600;color:var(--ink)}
.tog[aria-pressed="true"]{border-color:var(--gold);background:rgba(231,196,106,.18);box-shadow:0 0 0 1px var(--gold)}
.tog .pc{width:24px;height:32px;font-size:10px}
.total-bar{position:sticky;bottom:84px;background:rgba(15,49,39,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.total-bar .meter{flex:1;height:8px}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 6px;text-align:end;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:start}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
tfoot td{font-weight:700;border-bottom:0;font-size:14px}
td .muted{font-size:12px}

/* players + stats */
.plist{display:flex;flex-direction:column}
.pitem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pitem .grow{flex:1;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--gold)}
.kpi span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:88px 1fr 46px;align-items:center;gap:8px;font-size:13px}
.bar .track{height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;background:linear-gradient(90deg,#c9a24e,var(--gold));border-radius:6px}
.bar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plink{border:0;background:none;text-align:start;padding:0;min-width:0;font:inherit;color:inherit}
button.lbl.plink{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.form{display:flex;gap:4px;flex-wrap:wrap}
.form .f{width:26px;height:36px;border-radius:5px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:12px;background:var(--ivory);color:#777;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.form .f.w{color:#1f7a45} .form .f.l{color:var(--red)}
.best{background:linear-gradient(160deg,rgba(231,196,106,.2),rgba(0,0,0,.2));border:1px solid var(--gold);border-radius:12px;padding:10px 12px}
.best b{font-family:var(--f-display)}
.nameform{display:flex;flex-direction:column;gap:10px}
.nameform label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.nameform .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
textarea{font:12px/1.4 var(--f-mono);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:8px 10px;width:100%;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:rgba(0,0,0,.2);padding:10px;font-weight:600;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:99px;padding:5px 12px 5px 5px;font-weight:500;font-size:14px;color:var(--ink)}
.chip .avatar{width:26px;height:26px;font-size:10px;border-width:1px}
.chip.plain{padding:6px 12px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip:disabled{opacity:.35}
.chip .order{font:700 11px var(--f-mono)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}


.avatar{overflow:hidden}
.avatar.face{padding:0}
.avatar svg{width:100%;height:100%;display:block}
.avatar.xxl{width:84px;height:84px;font-size:28px;border-width:3px}
.aved{display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:14px;padding:12px}
.avhead{display:flex;align-items:center;gap:14px}
.avbtns{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.avbtns label.btn{cursor:pointer}
.avrow{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sws{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.sw[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.chip.mini{font-size:12px;padding:4px 10px}

/* home + history */
.glist,.hlist{display:flex;flex-direction:column;gap:10px}
.gcard{display:flex;flex-direction:column;gap:10px;text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--ink)}
.gcard:active,.hcard:active{transform:scale(.99)}
.gseats{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gs{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:58px}
.gs .nm{font-size:11.5px;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs b{font-size:15px}
.gs.hot b{color:var(--warn)}
.vs{font:600 10px var(--f-mono);color:var(--gold);letter-spacing:.1em}
.gwarn{font-size:12px;color:var(--warn)}
.go{font-size:13px;font-weight:600;color:var(--gold);align-self:flex-end}
.hcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:start;width:100%;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink)}
.hav{display:flex}
.hav .avatar{width:34px;height:34px}
.hav .avatar+.avatar{margin-inline-start:-10px}
.hwin{font-family:var(--f-display);font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmonth{display:flex;flex-direction:column;gap:8px}
.winrow{display:flex;gap:16px;flex-wrap:wrap}
.winner{display:flex;flex-direction:column;align-items:center;gap:4px}
.winner .avatar{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(231,196,106,.5)}
.redit{border:0;background:none;padding:0;color:var(--gold);font:inherit;font-family:var(--f-mono)}

/* dealer, substitutes, player of the month */
.avwrap{position:relative;display:inline-block}
.dealer{position:absolute;right:-16px;bottom:-4px;background:var(--gold);color:var(--gold-ink);font:700 9px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 6px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.dealnote{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;margin-top:-6px}
.dealnote .pc{width:22px;height:30px;font-size:9px}
.subnotes{margin:0;padding:0;padding-inline-start:18px;font-size:12.5px;color:var(--muted)}
td.was{color:var(--muted);font-style:italic}
.potm{border-color:var(--gold);background:linear-gradient(160deg,rgba(231,196,106,.16),rgba(0,0,0,.25))}
.potm-top{display:flex;align-items:center;gap:14px;width:100%}
.potm-name{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--gold)}
.crownwrap{position:relative;display:inline-block}
.crownic{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-8deg);color:var(--gold);font-size:22px;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.potm-run{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;width:100%}
.potm-past .potm-run{grid-template-columns:auto 1fr}
.potm-past{display:flex;flex-direction:column;gap:8px}
.potm-badge{color:var(--gold);border-color:var(--gold)}

/* language */
.hdr-r{display:flex;align-items:center;gap:8px;min-width:0}
.langbtn{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--gold);font:700 14px var(--f-logo-ar);display:grid;place-items:center;padding:0}
.langbtn.en{font:700 11px var(--f-mono)}
@media (max-width:440px){.logo .lat span{display:none}.logo .ar{font-size:23px}.brand small{padding:3px 8px}}
:root[lang="ar"]{--f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;--f-display:"Reem Kufi","IBM Plex Sans Arabic",serif}
:root[lang="ar"] .eyebrow,:root[lang="ar"] th,:root[lang="ar"] .seat .team,:root[lang="ar"] nav.tabs button{letter-spacing:0;text-transform:none}
:root[lang="ar"] .brand small{letter-spacing:0;font-family:var(--f-body)}
:root[lang="ar"] .eyebrow{font-size:12px}

/* online sync */
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.syncdot.busy{background:var(--gold);animation:pulse 1s infinite alternate}
.syncdot.offline{background:var(--muted)} .syncdot.error{background:var(--bad)}
.syncdot.big{width:14px;height:14px}
@keyframes pulse{to{opacity:.35}}
@media (prefers-reduced-motion:reduce){.syncdot.busy{animation:none}}
.syncbox{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.codebox{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.25);border:1px dashed var(--gold);border-radius:12px;padding:10px 12px}
.codebox b{font-size:24px;letter-spacing:.18em;color:var(--gold);flex:1}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;accent-color:var(--gold)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,36,28,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}

(function(){
const LIMIT = 101, TOTAL = 36, HEARTS = 13;
const KEY = 'sajjel-3endak-v1', OLDKEYS = ['leekha-scorebook-v2','leekha-scorebook-v1'];
const GAMES = {leekha:'Leekha'};
const display = p => p.alias ? p.alias : (p.first + (p.last ? ' ' + p.last[0].toUpperCase() + '.' : ''));
const fullName = p => [p.first, p.last].filter(Boolean).join(' ');
const PALETTE = ['#CDE6F5','#F2D1C9','#D6EFD9','#E3D7F5','#F5E6C4','#F5CDE1','#C9EFEA','#E8DCCB','#D4DCF7','#F0F0C8'];
const colorOf = id => { const p=S.players.find(x=>x.id===id); return (p&&p.color)||'#CDE6F5'; };
const avatar = (id, cls='') => { const p=S.players.find(x=>x.id===id); if(!p) return `<span class="avatar ${cls}" aria-hidden="true">?</span>`;
  if(p.photo) return `<span class="avatar ${cls}" style="background:${colorOf(id)} center/cover url('${p.photo}')" aria-hidden="true"></span>`;
  return `<span class="avatar face ${cls}" style="background:${colorOf(id)}" aria-hidden="true">${faceSVG(faceOf(p))}</span>`; };
const initials = p => ((p.first||'?')[0] + ((p.last||'')[0]||'')).toUpperCase();
function normalize(d){
  d.players.forEach(p=>{ if(p.first===undefined){ const parts=(p.name||'').trim().split(/\s+/); p.first=parts[0]||''; p.last=parts.slice(1).join(' '); }
    p.alias = p.alias||''; p.name = display(p); });
  d.players.forEach((p,i)=>{ if(!p.color) p.color = PALETTE[i % PALETTE.length]; });
  d.games.forEach(g=>{ g.type = g.type||'leekha'; });
  return d;
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- sample data (clearly marked) ---------- */
function sample(){
  let seed = 20261019; const rnd = ()=>{ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; };
  const names = [['Nicolas','Khoury','Nico'],['Rami','Saad',''],['Joelle','Haddad','Jojo'],['Karim','Nassar',''],['Maya','Aoun',''],['Tony','Khoury','Tony K']];
  const luck = [0.85,1.15,1,1.05,0.9,1.1]; // higher = tends to take more points
  const players = names.map(([first,last,alias],i)=>({id:'p'+i,first,last,alias,joined:'2026-08-01',sample:true}));
  const pick = seats=>{ const w=seats.map(p=>luck[+p.slice(1)]); let x=rnd()*w.reduce((a,b)=>a+b,0); for(let i=0;i<seats.length;i++){ x-=w[i]; if(x<=0) return seats[i]; } return seats[seats.length-1]; };
  const deal = seats=>{ const h={}; seats.forEach(p=>h[p]=0); for(let i=0;i<HEARTS;i++) h[pick(seats)]++; return {hearts:h,queen:pick(seats),ten:pick(seats)}; };
  const over = g=>{ const t=totals(g); return g.seats.some(p=>t[p]>=LIMIT); };
  let day = new Date('2026-08-10');
  const play = (mode,seats,maxRounds)=>{ day = new Date(day.getTime()+3*864e5);
    const g={id:uid(),type:'leekha',sample:true,date:maxRounds?'2026-10-19':day.toISOString().slice(0,10),mode,seats,teams:mode==='teams'?[[seats[0],seats[1]],[seats[2],seats[3]]]:null,rounds:[]};
    while(!over(g) && g.rounds.length<(maxRounds||99)){ const rd=deal(seats); if(mode==='solo'){ const m=seats.find(p=>rawPts(rd,p)===TOTAL); if(m) rd.moon=m; } g.rounds.push(rd); }
    return g; };
  const T = (a,b,c,d)=>['p'+a,'p'+b,'p'+c,'p'+d];
  const plan = [['teams',T(0,4,1,3)],['solo',T(0,1,2,3)],['teams',T(0,4,2,5)],['teams',T(1,3,2,5)],['teams',T(0,4,1,3)],['solo',T(0,2,4,5)],
    ['teams',T(0,2,1,3)],['teams',T(4,5,1,3)],['teams',T(0,4,1,3)],['solo',T(1,3,4,5)],['teams',T(0,1,4,3)],['teams',T(2,4,0,5)],
    ['teams',T(0,3,1,2)],['teams',T(0,4,2,5)],['solo',T(0,1,3,4)],['teams',T(1,3,2,5)],['teams',T(0,2,1,3)],['teams',T(4,5,1,3)],
    ['teams',T(0,4,1,3)],['solo',T(0,2,3,5)]];
  const games = plan.map(([m,s])=>play(m,s));
  const live = play('teams',T(0,4,1,3),3); live.updated=Date.now()-36e5; games.push(live);
  const live2 = play('solo',T(2,1,5,3),2); live2.date='2026-10-17'; live2.updated=Date.now()-3*864e5; games.push(live2);
  return normalize({players, games, current:live.id, sample:true});
}

/* ---------- scoring ---------- */
const rawPts = (rd,pid) => (rd.hearts[pid]||0) + (rd.queen===pid?13:0) + (rd.ten===pid?10:0);
/* Solo games: whoever takes all 36 scores 0 and every other player gets 36 */
const roundPts = (rd,pid) => rd.moon ? (rd.moon===pid?0:TOTAL) : rawPts(rd,pid);
/* Substitutes: a new player can take over a seat. Each round is scored to whoever sat there at the time,
   and the seat's running total carries over to the newcomer. */
function occAt(g,i){ const s=(g.seats0||g.seats).slice(); (g.subs||[]).forEach(x=>{ if(x.at<=i) s[x.seat]=x.in; }); return s; }
function totals(g){ const t={}; g.seats.forEach(p=>t[p]=0); g.rounds.forEach((rd,i)=>{ const o=occAt(g,i); g.seats.forEach((p,k)=>t[p]+=roundPts(rd,o[k])); }); return t; }
/* Dealer: whoever took the Q♠ last round deals next, unless one player took all 13 hearts (then they deal). First deal is random. */
function dealerOf(g){
  if(!g.rounds.length) return g.firstDealer && g.seats.includes(g.firstDealer) ? g.firstDealer : null;
  const i=g.rounds.length-1, rd=g.rounds[i];
  const d = Object.keys(rd.hearts).find(p=>rd.hearts[p]===HEARTS) || rd.queen;
  const k = occAt(g,i).indexOf(d); return k>=0 ? g.seats[k] : null;
}
function sides(g){ // returns [{label, members, score}]
  const t = totals(g);
  if(g.mode==='teams') return g.teams.map((m,i)=>({label:'Team '+(i?'B':'A'), members:m, score:m.reduce((a,p)=>a+t[p],0)}));
  return g.seats.map(p=>({label:pname(p), members:[p], score:t[p]}));
}
function result(g){
  if(g.mode==='teams'){ // individual scores; the first player to reach 101 loses for their team
    const t = totals(g); const over = g.seats.filter(p=>t[p]>=LIMIT); if(!over.length) return null;
    const top = over.sort((a,b)=>t[b]-t[a])[0]; const li = g.teams[0].includes(top)?0:1;
    const team = i=>({label:'Team '+(i?'B':'A'), members:g.teams[i], score:Math.max(...g.teams[i].map(p=>t[p]))});
    return {loser:{...team(li), who:top, score:t[top]}, winners:[team(1-li)]};
  }
  const sd = sides(g); const over = sd.filter(s=>s.score>=LIMIT);
  if(!over.length) return null;
  const loser = over.sort((a,b)=>b.score-a.score)[0];
  const rest = sd.filter(s=>s!==loser); const best = Math.min(...rest.map(s=>s.score));
  return {loser, winners: rest.filter(s=>s.score===best)};
}

function tr(str){ const m=String(str).match(/^(\s*)([\s\S]*?)(\s*)$/); const core=m[2]; if(!core) return str;
  let out = Object.prototype.hasOwnProperty.call(AR,core) ? AR[core] : null;
  if(out==null) for(const [re,rep] of ARX){ if(re.test(core)){ out=core.replace(re,rep); break; } }
  return out==null ? str : m[1]+out+m[3]; }
function localize(root){
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>n.parentElement&&n.parentElement.closest('script,style,svg,[data-raw]')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n; while((n=w.nextNode())){ if(n.__en==null) n.__en=n.nodeValue; const v = lang==='ar' ? tr(n.__en) : n.__en; if(n.nodeValue!==v) n.nodeValue=v; }
  root.querySelectorAll('[placeholder]').forEach(el=>{ if(el.__ph==null) el.__ph=el.getAttribute('placeholder'); el.setAttribute('placeholder', lang==='ar'?tr(el.__ph):el.__ph); });
}
function applyLang(){ const r=document.documentElement; r.lang = lang==='ar'?'ar':'en'; r.dir = lang==='ar'?'rtl':'ltr';
  const b=$('#langBtn'); if(b){ b.textContent = lang==='ar'?'EN':'ع'; b.className='langbtn'+(lang==='ar'?' en':''); b.setAttribute('aria-label', lang==='ar'?'English':'العربية'); } }

/* ---------- card glyphs ---------- */
const card = (rank,suit,cls='') => `<span class="pc ${suit==='♥'||suit==='♦'?'r':'k'} ${cls}" aria-label="${rank} of ${suit}"><span>${rank}</span><span>${suit}</span></span>`;
const handFor = (rd,pid,cls='') => {
  let h=''; for(let i=0;i<(rd.hearts[pid]||0);i++) h+=card('1','♥',cls);
  if(rd.queen===pid) h+=card('Q','♠',cls); if(rd.ten===pid) h+=card('10','♦',cls); return h;
};

/* ---------- views ---------- */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===tab?'page':'false'));
  const v = $('#view');
  if(tab==='game') v.innerHTML = draft ? viewRound() : (setup ? viewSetup() : (cur() ? viewGame() : viewHome()));
  if(tab==='history') v.innerHTML = draft ? viewRound() : (cur() ? viewGame() : viewHistory());
  if(tab==='players') v.innerHTML = profile ? viewProfile(profile) : viewPlayers();
  if(tab==='stats') v.innerHTML = profile ? viewProfile(profile) : viewStats();
  applyLang();
  const g = cur(); $('#hdrSub').textContent = g ? (result(g)&&!draft ? 'Finished' : `Round ${draft&&draft.index!=null ? draft.index+1 : g.rounds.length + (draft?1:0)}`) : 'Leekha';
  localize(document.querySelector('.app')); localize(document.querySelector('nav.tabs')); pendingRender=false; paintSync();
}

function sampleNote(){ if(!S.players.length && !S.games.length) return `<div class="notice">New here? Register your players below, or <button class="btn sm ghost" data-act="load-sample">try it with example data</button> first.</div>`; return S.sample ? `<div class="notice">Example players and games are loaded so you can see how it works. <button class="btn sm ghost" data-act="clear-sample">Clear examples</button></div>` : ''; }

function viewGame(){
  const g = cur();
  const t = totals(g), res = result(g);
  const sd = sides(g);
  // partners sit opposite each other: South, West, North, East
  const order = g.mode==='teams' ? [g.seats[0], g.seats[2], g.seats[1], g.seats[3]] : g.seats;
  const spots = ['s','w','n','e'];
  const dl = dealerOf(g);
  const board = order.map((p,i)=>seat(p, t[p], g.mode==='teams' ? (g.teams[0].includes(p)?'TEAM A':'TEAM B') : '', res, spots[i], p===dl)).join('');
  const subNotes = (g.subs||[]).map(x=>`<li>${esc(pname(x.in))} took ${esc(pname(x.out))}'s seat ${x.at?`after round ${x.at}`:'before the first round'}</li>`).join('');
  const others = S.players.filter(p=>!g.seats.includes(p.id));
  const subPanel = !res && subState ? `<section class="panel"><div class="row between"><h2>Substitute a player</h2><button class="btn sm ghost" data-act="sub-cancel">Cancel</button></div>
     <div class="eyebrow">Who is leaving?</div><div class="chips">${g.seats.map(p=>`<button class="chip" data-subout="${p}" aria-pressed="${subState.out===p}">${avatar(p)}${esc(pname(p))}</button>`).join('')}</div>
     <div class="eyebrow">Who takes the seat?</div>${others.length?`<div class="chips">${others.map(p=>`<button class="chip" data-subin="${p.id}" aria-pressed="${subState.in===p.id}">${avatar(p.id)}${esc(p.name)}</button>`).join('')}</div>`:`<p class="muted" style="margin:0;font-size:13px">Everyone registered is already at this table. Add the new player in the Players tab first.</p>`}
     ${subState.out&&subState.in?`<div class="notice"><b>${esc(pname(subState.in))}</b> takes <b>${esc(pname(subState.out))}</b>'s seat and continues from <b>${t[subState.out]}</b> points. Past rounds stay in ${esc(pname(subState.out))}'s own stats.</div>`:''}
     <button class="btn primary" data-act="sub-yes" ${subState.out&&subState.in?'':'disabled'}>Confirm substitution</button></section>` : '';
  const firstDeal = !res && !g.rounds.length ? `<section class="panel"><div class="row between"><div class="eyebrow">First dealer</div><button class="btn sm ghost" data-act="rand-dealer">Pick at random</button></div>
     <div class="chips">${g.seats.map(p=>`<button class="chip" data-firstdealer="${p}" aria-pressed="${dl===p}">${avatar(p)}${esc(pname(p))}</button>`).join('')}</div>
     <div class="muted" style="font-size:12px">After this, whoever takes the Q♠ deals the next round. If someone takes all 13 hearts, they deal instead.</div></section>` : '';
  const winners = res ? res.winners.flatMap(w=>w.members) : [];
  const banner = res ? `<section class="panel result">
     <div class="row between"><span class="crown">${winners.length>1?'Winners':'Winner'}</span><span class="pill lose">${esc(res.loser.who?pname(res.loser.who):res.loser.label)} hit ${res.loser.score}</span></div>
     <div class="winrow">${winners.map(p=>`<span class="winner">${avatar(p,'xl')}<b>${esc(pname(p))}</b></span>`).join('')}</div>
     <p class="muted" style="margin:0;font-size:13px">${g.mode==='teams'?res.winners[0].label+' takes the game':'Lowest score when someone reached '+LIMIT} · ${g.rounds.length} rounds</p>
     <div class="row" style="flex-wrap:wrap"><button class="btn primary" data-act="rematch">Rematch</button><button class="btn" data-act="share">Share result</button></div>
     ${shareMsg?`<div style="font-size:13px">${esc(shareMsg)}</div>`:''}</section>` : '';
  const backTo = tab==='history' ? 'History' : 'All tables';
  return `<section class="row between"><button class="btn sm ghost" data-act="close-game">← ${backTo}</button><span class="eyebrow">${g.mode==='teams'?'Teams of 2':'Solo'} · ${esc(g.date)}</span></section>
  ${banner}
  <div class="tablebox"><div class="oval"></div>
    <div class="center"><div class="pile">${card('1','♥','big')}${card('Q','♠','big')}${card('10','♦','big')}</div><div class="rlabel">${g.rounds.length?`Round ${g.rounds.length} played`:'First deal'}</div></div>
    ${board}</div>
  ${dl&&!res?`<div class="dealnote">${card('Q','♠')} <span><b>${esc(pname(dl))}</b> deals ${g.rounds.length?'next':'first'}</span></div>`:''}
  ${firstDeal}
  ${res?'':`<button class="btn primary big" data-act="add-round">${g.rounds.length?'Deal next round':'Score the first round'}</button>`}
  ${subNotes?`<ul class="subnotes">${subNotes}</ul>`:''}
  ${subPanel}
  ${historyTable(g)}
  ${lastRoundCards(g)}
  <div class="row" style="justify-content:flex-end;flex-wrap:wrap">${res?'':`${subState?'':`<button class="btn sm ghost" data-act="sub-open">Substitute a player</button>`}<button class="btn sm ghost" data-act="undo" ${g.rounds.length?'':'disabled'}>Undo last round</button>`}
    ${confirmDel?`<span style="font-size:13px">Delete this game for good?</span><button class="btn sm danger" data-act="del-yes">Delete</button><button class="btn sm" data-act="del-no">Keep</button>`:`<button class="btn sm ghost danger" data-act="del-game">Delete game</button>`}</div>`;
}
function seat(pid, score, team, res, spot, dealer){
  const pct = Math.min(100, score/LIMIT*100);
  const won = res && res.winners.some(w=>w.members.includes(pid)), lost = res && res.loser.members.includes(pid);
  const cls = [spot, score>=LIMIT?'bad':(score>=80?'warn':''), won?'won':'', lost?'lost':''].join(' ');
  const tag = res ? (lost?'<span class="pill lose">Lost</span>':(won?'<span class="pill win">Won</span>':(team?`<span class="team">${team}</span>`:''))) : (score>=80&&score<LIMIT?`<span class="pill hot">${LIMIT-score} left</span>`:(team?`<span class="team">${team}</span>`:''));
  return `<div class="seat ${cls}"><span class="avwrap">${avatar(pid,'lg')}${dealer&&!res?'<span class="dealer">Deals</span>':''}</span><span class="name">${esc(pname(pid))}</span>
    <span class="score">${score}<small>/${LIMIT}</small></span><div class="meter"><i style="width:${pct}%"></i></div><div class="tag">${tag}</div></div>`;
}
function historyTable(g){
  if(!g.rounds.length) return `<section class="panel"><p class="muted" style="margin:0">No rounds yet. Tap “Score the first round” after the first hand is played.</p></section>`;
  const t = totals(g);
  return `<section class="panel"><div class="row between"><div class="eyebrow">Round by round</div><span class="muted" style="font-size:11.5px">Tap ✎ to fix a round</span></div><div class="tablewrap"><table>
    <thead><tr><th>#</th>${g.seats.map(p=>`<th>${esc(pname(p).slice(0,7))}</th>`).join('')}</tr></thead>
    <tbody>${g.rounds.map((rd,i)=>`<tr><td class="num"><button class="redit" data-editround="${i}" aria-label="Fix round ${i+1}">${i+1} ✎</button></td>${occAt(g,i).map((p,k)=>{const v=roundPts(rd,p);return `<td class="num${p!==g.seats[k]?' was':''}" ${p!==g.seats[k]?`title="${esc(pname(p))}"`:''}>${v?v:'<span class="muted">0</span>'}${rd.queen===p?' <span>♠</span>':''}${rd.ten===p?' <span style="color:var(--red)">♦</span>':''}${rd.moon===p?' <span class="ok">★</span>':''}</td>`}).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td>${g.seats.map(p=>`<td class="num">${t[p]}</td>`).join('')}</tr></tfoot></table></div></section>`;
}
function lastRoundCards(g){
  if(!g.rounds.length) return '';
  const rd = g.rounds[g.rounds.length-1];
  return `<section class="panel"><div class="eyebrow">Cards taken in round ${g.rounds.length}</div>
    ${occAt(g,g.rounds.length-1).map(p=>`<div class="row" style="align-items:flex-start"><div style="width:76px;flex:none;font-weight:600">${esc(pname(p))}<div class="num muted" style="font-size:12px">${rd.moon===p?'Took all 36 → 0':roundPts(rd,p)+' pts'}</div></div><div class="hand">${handFor(rd,p)||'<span class="muted" style="font-size:13px">Clean hand</span>'}</div></div>`).join('')}</section>`;
}
function tableCard(g){
  const t = totals(g); const order = g.mode==='teams' ? [g.teams[0][0],g.teams[0][1],g.teams[1][0],g.teams[1][1]] : g.seats.slice().sort((a,b)=>t[a]-t[b]);
  const hot = g.seats.filter(p=>t[p]>=80).sort((a,b)=>t[b]-t[a])[0];
  return `<button class="gcard" data-open="${g.id}">
    <div class="row between"><span class="eyebrow">${g.mode==='teams'?'Teams of 2':'Solo'} · ${g.rounds.length?`round ${g.rounds.length}`:'not started'}</span><span class="muted" style="font-size:12px">${ago(lastPlayed(g))}</span></div>
    <div class="gseats">${order.map((p,i)=>`${g.mode==='teams'&&i===2?'<span class="vs">vs</span>':''}<span class="gs ${t[p]>=80?'hot':''}">${avatar(p)}<span class="nm">${esc(pname(p))}</span><b class="num">${t[p]}</b></span>`).join('')}</div>
    ${hot?`<div class="gwarn">${esc(pname(hot))} is ${LIMIT-t[hot]} away from ${LIMIT}</div>`:''}
    ${dealerOf(g)?`<div class="muted" style="font-size:12px">${esc(pname(dealerOf(g)))} deals ${g.rounds.length?'next':'first'}</div>`:''}

/* stats */
function stats(){
  const st = {}; S.players.forEach(p=>st[p.id]={games:0,wins:0,losses:0,rounds:0,pts:0,queens:0,tens:0,clean:0,moons:0});
  S.games.forEach(g=>{
    const res = result(g);
    g.rounds.forEach(rd=>Object.keys(rd.hearts).forEach(p=>{ if(!st[p]) return; const v=roundPts(rd,p); st[p].rounds++; st[p].pts+=v; if(rd.queen===p)st[p].queens++; if(rd.ten===p)st[p].tens++; if(!v&&rd.moon!==p)st[p].clean++; if(rd.moon===p)st[p].moons++; }));
    if(res) g.seats.forEach(p=>{ if(!st[p]) return; st[p].games++; if(res.loser.members.includes(p)) st[p].losses++; if(res.winners.some(w=>w.members.includes(p))) st[p].wins++; });
  });
  return st;
}
function monthTable(){ // month -> player -> {games,wins,pts,rounds}
  const m = {};
  S.games.forEach(g=>{ const r=result(g); if(!r) return; const k=(g.date||'').slice(0,7); const mt=m[k]=m[k]||{};
    g.seats.forEach(p=>{ const x=mt[p]=mt[p]||{games:0,wins:0,pts:0,rounds:0}; x.games++; if(r.winners.some(w=>w.members.includes(p))) x.wins++; });
    g.rounds.forEach(rd=>Object.keys(rd.hearts).forEach(p=>{ const x=mt[p]=mt[p]||{games:0,wins:0,pts:0,rounds:0}; x.pts+=roundPts(rd,p); x.rounds++; })); });
  return m;
}
const MIN_GAMES = 3;
function rankMonth(mt){ return Object.entries(mt).filter(([p,x])=>x.games>=MIN_GAMES && S.players.some(q=>q.id===p))
  .sort((a,b)=>b[1].wins-a[1].wins || b[1].wins/b[1].games-a[1].wins/a[1].games || a[1].pts/Math.max(1,a[1].rounds)-b[1].pts/Math.max(1,b[1].rounds)); }
const monthName = k => { const [y,mm]=k.split('-'); return new Date(+y, +mm-1, 1).toLocaleDateString(lang==='ar'?'ar-LB':'en-GB',{month:'long',year:'numeric'}); };
function potmTitles(){ const t={}; const now=new Date().toISOString().slice(0,7); const mt=monthTable(); Object.keys(mt).filter(k=>k<now).forEach(k=>{ const top=rankMonth(mt[k])[0]; if(top) (t[top[0]]=t[top[0]]||[]).push(k); }); return t; }
function potmPanel(){
  const mt = monthTable(); const now = new Date().toISOString().slice(0,7);

    <div class="muted" style="font-size:11.5px">Most wins this month (at least ${MIN_GAMES} games). Ties go to the better win rate, then the fewest points per round.</div>

/* ---------- partnerships & player dashboard ---------- */
const pct = (w,g) => g ? Math.round(w/g*100)+'%' : '–';
const pairKey = m => m.slice().sort().join('|');
const pairName = k => k.split('|').map(pname).join(' & ');
function partnerships(){
  const pairs = {}, vs = {};
  S.games.forEach(g=>{ if(g.mode!=='teams') return; const res = result(g); if(!res) return;
    g.teams.forEach((m,i)=>{ const k=pairKey(m), ok=pairKey(g.teams[1-i]); const won=res.winners[0].members.includes(m[0]);
      const p = pairs[k] || (pairs[k]={key:k,members:m.slice().sort(),games:0,wins:0}); p.games++; if(won) p.wins++;
      const row = vs[k] || (vs[k]={}); const v = row[ok] || (row[ok]={key:ok,games:0,wins:0}); v.games++; if(won) v.wins++; });
  });
  return {pairs, vs};
}
const byRate = (a,b) => b.wins/b.games - a.wins/a.games || b.games - a.games;
function partnerBoards(){
  const {pairs, vs} = partnerships(); const list = Object.values(pairs).sort(byRate);
  if(!list.length) return '';
  const riv = []; Object.keys(vs).forEach(k=>Object.values(vs[k]).forEach(o=>{ if(k<o.key) riv.push({a:k,b:o.key,games:o.games,wins:o.wins}); }));
  riv.sort((x,y)=>y.games-x.games);
  return `<section class="panel"><div><div class="eyebrow">Best partnerships</div><div class="muted" style="font-size:12px">Teams of 2, finished games</div></div>
    <div class="tablewrap"><table><thead><tr><th>Pair</th><th>Games</th><th>W–L</th><th>Win %</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(pairName(x.key))}</td><td class="num">${x.games}</td><td class="num">${x.wins}–${x.games-x.wins}</td><td class="num">${pct(x.wins,x.games)}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="panel"><div><div class="eyebrow">Partnership rivalries</div><div class="muted" style="font-size:12px">Record of the first pair against the second</div></div>
    <div class="tablewrap"><table><thead><tr><th>Matchup</th><th>Games</th><th>Record</th></tr></thead><tbody>${riv.map(r=>`<tr><td>${esc(pairName(r.a))}<br><span class="muted">vs ${esc(pairName(r.b))}</span></td><td class="num">${r.games}</td><td class="num">${r.wins}–${r.games-r.wins}</td></tr>`).join('')}</tbody></table></div></section>`;
}
function spark(hist){
  if(hist.length<2) return '<p class="muted" style="margin:0">Needs at least 2 finished games.</p>';
  const W=320, H=130, L=28, R=8, max=Math.max(LIMIT+20, ...hist.map(h=>h.final));
  const x = i => L + i*(W-L-R)/(hist.length-1), y = v => H-14-(v/max)*(H-26);
  const pts = hist.map((h,i)=>`${x(i).toFixed(1)},${y(h.final).toFixed(1)}`).join(' ');
  const mono = 'font-family="IBM Plex Mono, monospace" font-size="10"';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Final score in each game">
    <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/><text x="0" y="${y(0)+4}" ${mono} fill="var(--muted)">0</text>
    <line x1="${L}" x2="${W-R}" y1="${y(50)}" y2="${y(50)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="0" y="${y(50)+4}" ${mono} fill="var(--muted)">50</text>
    <line x1="${L}" x2="${W-R}" y1="${y(LIMIT)}" y2="${y(LIMIT)}" stroke="var(--bad)" stroke-dasharray="4 4"/><text x="0" y="${y(LIMIT)+4}" ${mono} fill="var(--bad)">${LIMIT}</text>
    <polyline points="${pts}" fill="none" stroke="var(--felt)" stroke-width="2"/>
    ${hist.map((h,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(h.final).toFixed(1)}" r="4" fill="${h.won?'var(--good)':h.lost?'var(--bad)':'var(--muted)'}"/>`).join('')}
  </svg><div class="muted" style="font-size:12px">Green: won · Red: lost · Grey: neither (solo games)</div>`;
}
function viewProfile(id){
  const p = S.players.find(x=>x.id===id);
  if(!p){ profile=null; return tab==='stats' ? viewStats() : viewPlayers(); }
  const s = stats()[id]; const {pairs, vs} = partnerships(); const titles = potmTitles()[id]||[];
  const hist = S.games.filter(g=>g.seats.includes(id) && result(g)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)
    .map(g=>{ const r=result(g); return {g, won:r.winners.some(w=>w.members.includes(id)), lost:r.loser.members.includes(id), final:totals(g)[id]}; });

    <div class="two"><label>First name<input type="text" id="${id}-first" value="${esc(p.first)}" maxlength="24" autocomplete="off" required></label>

    <label>Alias <span class="muted">(optional, shown on the scoreboard)</span><input type="text" id="${id}-alias" value="${esc(p.alias)}" maxlength="16" autocomplete="off" placeholder="e.g. Abou Elie, Nico, Big Rami"></label>
    <div><div class="eyebrow" style="margin-bottom:8px">Avatar</div><div id="avEd" class="aved">${avatarEditor()}</div></div>
    <div class="err" id="${id}-err" style="font-size:13px" hidden></div>
    <button class="btn primary" type="submit">${label}</button></form>`;
}
function checkName(first, last, alias, exceptId){
  if(!first || !last) return 'Enter both a first and a last name.';
  const others = S.players.filter(p=>p.id!==exceptId); const low = s=>s.toLowerCase();
  if(alias && others.some(p=>low(p.alias||'')===low(alias) || (!p.alias && low(p.name)===low(alias)))) return `The alias “${alias}” is already taken. Pick another one.`;
  if(!alias){
    const same = others.find(p=>low(p.first)===low(first) && low(p.last)===low(last));
    if(same) return `${first} ${last} is already registered. Add an alias to tell them apart.`;
    const shown = display({first,last,alias:''});
    if(others.some(p=>low(p.name)===low(shown))) return `Another player already shows as “${shown}”. Add an alias to tell them apart.`;
  }
  return '';
}

/* ---------- events ---------- */
function goTab(t){ if(t===tab){ if(t==='game'){ openG=null; setup=null; } if(t==='history') openH=null; } tab=t; draft=null; confirmDel=false; shareMsg=''; }
$('#langBtn').addEventListener('click', ()=>{ lang = lang==='ar'?'en':'ar'; try{ localStorage.setItem('sajjel-lang', lang); }catch(e){} render(); });
document.querySelector('nav.tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; goTab(b.dataset.tab); confirmClear=false; profile=null; editing=false; backupMsg=''; showBackup=false; confirmRestore=false; render(); window.scrollTo(0,0); });
$('#view').addEventListener('submit', e=>{
  e.preventDefault(); const id = e.target.id; const v = k => $('#'+id+'-'+k).value.trim().replace(/\s+/g,' ');
  const first=v('first'), last=v('last'), alias=v('alias'); const err=$('#'+id+'-err');
  const editId = id==='editForm' ? profile : null;
  const problem = checkName(first, last, alias, editId);
  if(problem){ err.textContent=problem; err.hidden=false; localize(err); return; }
  if(editId){ const p=S.players.find(x=>x.id===editId); Object.assign(p,{first,last,alias,face:avDraft.face,photo:avDraft.photo}); p.name=display(p); editing=false; avDraft=null; save(); render(); return; }
  const p={id:uid(),first,last,alias,face:avDraft.face,photo:avDraft.photo,color:avDraft.color,joined:new Date().toISOString().slice(0,10)}; p.name=display(p);
  avDraft=null; S.players.push(p); if(!save()){ S.players.pop(); err.textContent='The phone is out of storage space for this app. Remove some player photos and try again.'; err.hidden=false; localize(err); return; } render(); $('#addForm-first').focus();
});
$('#view').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  if(b.form && b.type==='submit') return; // let the form's submit handler run; re-rendering here would remove the form first
  if(b.dataset.av){ const k=b.dataset.av; if(k==='glasses') avDraft.face.glasses=!avDraft.face.glasses; else avDraft.face[k]=Number(b.dataset.v); if(k==='hair'&&avDraft.face.hair===6) avDraft.face.facial=0; refreshAvatar(); return; }
  if(b.dataset.avact==='shuffle'){ avDraft.face=randomFace(Date.now()^Math.floor(Math.random()*1e9)); refreshAvatar(); return; }
  if(b.dataset.avact==='nophoto'){ avDraft.photo=null; refreshAvatar(); return; }
  const g = cur(); const act = b.dataset.act;
  if(b.dataset.go){ goTab(b.dataset.go); window.scrollTo(0,0); }
  if(b.dataset.open){ setOpen(b.dataset.open); window.scrollTo(0,0); }
  if(act==='close-game'){ setOpen(null); }
  if(b.dataset.hmode) histMode=b.dataset.hmode;
  if(b.dataset.hplayer) histPlayer = histPlayer===b.dataset.hplayer ? null : b.dataset.hplayer;
  if(act==='sub-open') subState={out:null,in:null};
  if(act==='sub-cancel') subState=null;
  if(b.dataset.subout) subState.out=b.dataset.subout;
  if(b.dataset.subin) subState.in=b.dataset.subin;
  if(act==='sub-yes'){ const k=g.seats.indexOf(subState.out); if(!g.seats0) g.seats0=g.seats.slice(); (g.subs=g.subs||[]).push({seat:k,out:subState.out,in:subState.in,at:g.rounds.length});
    g.seats[k]=subState.in; if(g.teams) g.teams=g.teams.map(m=>m.map(x=>x===subState.out?subState.in:x)); if(g.firstDealer===subState.out) g.firstDealer=subState.in;
    g.updated=Date.now(); subState=null; save(); }
  if(b.dataset.firstdealer){ g.firstDealer=b.dataset.firstdealer; save(); }
  if(act==='rand-dealer'){ g.firstDealer=g.seats[Math.floor(Math.random()*4)]; save(); }
  if(act==='del-game') confirmDel=true;
  if(act==='del-no') confirmDel=false;
  if(act==='del-yes'){ S.games=S.games.filter(x=>x!==g); setOpen(null); save(); }
  if(act==='rematch'){ const ng={id:uid(),type:'leekha',date:new Date().toISOString().slice(0,10),updated:Date.now(),mode:g.mode,seats:g.seats.slice(),teams:g.teams?g.teams.map(t=>t.slice()):null,rounds:[],firstDealer:g.seats[Math.floor(Math.random()*4)]};
    S.games.push(ng); tab='game'; openG=ng.id; openH=null; shareMsg=''; save(); window.scrollTo(0,0); }
  if(act==='share'){ const r=result(g), t=totals(g); const w=r.winners.flatMap(x=>x.members).map(pname).join(' & ');
    const txt=`سجّل عندك · Sajjel 3endak\nLeekha · ${g.date} · ${g.mode==='teams'?'Teams':'Solo'}\n🏆 ${w}\n${r.loser.who?pname(r.loser.who):r.loser.label} hit ${r.loser.score}\n\n${g.seats.slice().sort((a,b)=>t[a]-t[b]).map(p=>`${pname(p)}: ${t[p]}`).join('\n')}\n(${g.rounds.length} rounds)`;
    const done=m=>{ shareMsg=m; render(); };
    if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); }
    else { try{ navigator.clipboard.writeText(txt).then(()=>done('Result copied. Paste it in your WhatsApp group.')).catch(()=>done('Sharing is not available here.')); }catch(err){ shareMsg='Sharing is not available here.'; } } }
  if(b.dataset.editround){ const rd=g.rounds[+b.dataset.editround]; draft={hearts:{...rd.hearts},queen:rd.queen,ten:rd.ten,index:+b.dataset.editround}; window.scrollTo(0,0); }
  if(act==='new-game'){ setup={mode:'solo',seats:[]}; draft=null; }
  if(act==='cancel-setup') setup=null;
  if(b.dataset.mode) setup.mode=b.dataset.mode;
  if(b.dataset.seat){ const i=setup.seats.indexOf(b.dataset.seat); i>=0?setup.seats.splice(i,1):setup.seats.push(b.dataset.seat); }
  if(act==='start'){ const s=setup.seats; const ng={id:uid(),type:'leekha',date:new Date().toISOString().slice(0,10),mode:setup.mode,seats:s.slice(),teams:setup.mode==='teams'?[[s[0],s[1]],[s[2],s[3]]]:null,rounds:[]};
    ng.updated=Date.now(); ng.firstDealer=s[Math.floor(Math.random()*4)]; S.games.push(ng); openG=ng.id; setup=null; save(); }
  if(act==='add-round'){ draft={hearts:{},queen:null,ten:null}; g.seats.forEach(p=>draft.hearts[p]=0); }
  if(act==='cancel-round') draft=null;
  if(b.dataset.h){ const p=b.dataset.h; draft.hearts[p]=Math.max(0,(draft.hearts[p]||0)+Number(b.dataset.d)); }
  if(b.dataset.sp){ const k=b.dataset.sp; draft[k] = draft[k]===b.dataset.p ? null : b.dataset.p; }
  if(act==='save-round'){ const before=totals(g), wasOver=!!result(g); const idx=draft.index; delete draft.index; delete draft.moon;
    if(g.mode==='solo'){ const m=Object.keys(draft.hearts).find(p=>rawPts(draft,p)===TOTAL); if(m) draft.moon=m; }
    if(idx!=null) g.rounds[idx]=draft; else { g.rounds.push(draft); g.updated=Date.now(); }
    draft=null; save(); window.scrollTo(0,0);
    const after=totals(g); try{ if(!wasOver && result(g)) navigator.vibrate&&navigator.vibrate([120,60,120,60,300]); else if(g.seats.some(p=>before[p]<80&&after[p]>=80)) navigator.vibrate&&navigator.vibrate(150); }catch(err){} }
  if(act==='undo'){ g.rounds.pop(); g.updated=Date.now(); save(); }
  if(act==='load-sample'){ S=sample(); openG=openH=null; save(); }
  if(act==='clear-sample'){ const keep=S.players.filter(p=>!p.sample); const ids=new Set(keep.map(p=>p.id)); S={players:keep,games:S.games.filter(x=>!x.sample && x.seats.every(p=>ids.has(p))),current:null,sample:false}; openG=openH=null; histPlayer=null; save(); }
  if(b.dataset.del){ S.players=S.players.filter(p=>p.id!==b.dataset.del); save(); }
  if(b.dataset.prof){ profile=b.dataset.prof; window.scrollTo(0,0); }
  if(act==='back'){ profile=null; editing=false; }
  if(act==='edit-player'){ editing=true; avDraft=null; }
  if(act==='cancel-edit'){ editing=false; avDraft=null; }
  if(act==='copy-backup'){ const txt=JSON.stringify(S); showBackup=false; backupMsg='';
    try{ navigator.clipboard.writeText(txt).then(()=>{ backupMsg=`Backup copied: ${S.players.length} players, ${S.games.length} games.`; render(); }).catch(()=>{ showBackup=true; render(); }); }catch(err){ showBackup=true; } }
  if(act==='download-backup'){ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sajjel-3endak-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); backupMsg='Backup file saved.'; }
  if(act==='show-restore'){ confirmRestore=true; backupMsg=''; }
  if(act==='cancel-restore') confirmRestore=false;
  if(act==='restore'){ try{ const d=JSON.parse($('#restoreIn').value); if(!Array.isArray(d.players)||!Array.isArray(d.games)) throw 0;
      if(SY.code) leaveGroup(); S=normalize({players:d.players,games:d.games,current:d.current||null,sample:false}); save(); confirmRestore=false; backupMsg=`Restored ${S.players.length} players and ${S.games.length} games.`; }
    catch(err){ backupMsg='That text is not a Sajjel 3endak backup. Paste the full text you copied with “Copy backup”.'; } }
  if(act==='sync-create'){ syncCreate(); return; }
  if(act==='sync-join'){ syncJoin(); return; }
  if(act==='sync-now'){ syncMsg=''; syncNow(); }
  if(act==='sync-copy'){ try{ navigator.clipboard.writeText(SY.code).then(()=>{ syncMsg='Code copied.'; render(); }).catch(()=>{ syncMsg='Copy blocked. The code is '+SY.code+'.'; render(); }); }catch(err){ syncMsg='The code is '+SY.code+'.'; } }
  if(act==='sync-leave') confirmLeave=true;
  if(act==='sync-leave-no') confirmLeave=false;
  if(act==='sync-leave-yes'){ leaveGroup(); confirmLeave=false; syncMsg=''; }
  if(act==='reset') confirmClear=true;
  if(act==='reset-no') confirmClear=false;
  if(act==='reset-yes'){ if(SY.code) leaveGroup(); S={players:[],games:[],current:null,sample:false}; openG=openH=null; confirmClear=false; save(); }
  render();
});
$('#view').addEventListener('change', e=>{ if(e.target.id==='avFile' && e.target.files[0]){ resizePhoto(e.target.files[0]).then(d=>{ avDraft.photo=d; refreshAvatar(); }).catch(()=>{ const er=$('#avErr'); if(er){ er.textContent='That file could not be opened as a photo. Try a JPG or PNG.'; er.hidden=false; localize(er); } }); return; } });
$('#view').addEventListener('change', e=>{ if(e.target.id!=='backupFile' || !e.target.files[0]) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.players)||!Array.isArray(d.games)) throw 0; if(SY.code) leaveGroup(); S=normalize({players:d.players,games:d.games,current:d.current||null,sample:false}); save(); backupMsg=`Restored ${S.players.length} players and ${S.games.length} games.`; }catch(err){ backupMsg='That file is not a Sajjel 3endak backup.'; } render(); };
  r.readAsText(e.target.files[0]); });
// keep the screen awake while scoring
let lock=null; async function wake(){ try{ if('wakeLock' in navigator && document.visibilityState==='visible') lock=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', wake); wake();
// sync when the app opens, comes back to the screen, gets internet back, and every 20 seconds while open
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') syncNow(); });
window.addEventListener('online', ()=>syncNow());
setInterval(()=>{ if(document.visibilityState==='visible') syncNow(); }, 20000);
document.addEventListener('focusout', ()=>{ if(pendingRender) setTimeout(()=>{ if(pendingRender) safeRender(); }, 50); });
render(); syncNow();
})();
</script>
